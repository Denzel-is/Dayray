<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="../static/static/registration.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Основной шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"> 
</head>
<body>
    <div class="registration-container">
        <div class="image-container">
            <img src="../static/static/signup.svg" alt="Регистрация баннер" class="header-image">
        </div>
        <h1>Регистрация</h1>
        <form id="registration-form">
            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" name="username" required>
            </div>
           
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Подтвердите пароль:</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            <button type="submit" class="submit-button">Зарегистрироваться</button>
        </form>
        <p id="error-message" class="error-message" style="display:none;">Ошибка регистрации. Пожалуйста, попробуйте снова.</p>
        <p id="success-message" class="success-message" style="display:none;">Регистрация успешна! Вы будете перенаправлены...</p>
    </div>

    <script>
        const form = document.getElementById('registration-form');
        const errorMessage = document.getElementById('error-message');
        const successMessage = document.getElementById('success-message');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const formData = new FormData(form);
            const user = {
                username: formData.get('username'),
                phoneNumber: formData.get('phone-number'),
                city: formData.get('city'),
                address: formData.get('address'),
                firstName: formData.get('first-name'),
                email: formData.get('email'),
                password: formData.get('password'),
                confirmPassword: formData.get('confirm-password')
            };

            if (user.password !== user.confirmPassword) {
                alert('Пароли не совпадают!');
                return;
            }

            try {
                const response = await fetch('http://localhost:5107/api/Account/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(user)
                });

                const data = await response.json();

                if (response.ok) {
                    successMessage.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    throw new Error(data.message || 'Ошибка регистрации');
                }
            } catch (err) {
                errorMessage.style.display = 'block';
                console.error('Error:', err);
            }
        });
    </script>
</body>
</html>
