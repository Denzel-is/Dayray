<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="../static/static/cart.css">
    <title>Корзина</title>
</head>
<body>
    <header>
        <a id="backButton" href="/">Назад</a>
    </header>
   
    <div class="cart-title">
        <h1>Корзина</h1>
    </div>
    <div class="cart-container">
        {% for product in cart_data %}
            <div class="cart-item">
                <div class="cart-image">
                    <img src="{{ product['image_url'] }}" alt="{{ product['name'] }}">
                </div>
                <p>{{ product['name'] }}</p>
                <p class="price">{{ product['price'] }} тг.</p>
                <div class="quantity-controls">
                    <form action="{{ url_for('cart.update_quantity', product_id=product['product_id']) }}" method="post" class="quantity-form">
                        <button type="submit" name="change" value="decrease" class="quantity-button">-</button>
                        <span class="quantity" id="quantity_{{ product['product_id'] }}">{{ product['quantity'] }}</span>
                        <button type="submit" name="change" value="increase" class="quantity-button">+</button>
                    </form>
                </div>
                <form action="{{ url_for('cart.remove_from_cart', product_id=product['product_id']) }}" method="post">
                    <button class="remove-item-button" type="submit">Удалить из корзины</button>
                </form>
            </div>
        {% endfor %}
        <div id="totalPrice">Общая стоимость: {{ total }} тг.</div>
    </div>

    {% if cart_data %}
    <form method="POST" action="{{ url_for('pay.pay') }}">
        <!-- Передаем order_id как скрытое поле -->
        <input type="hidden" name="order_id" value="{{ order_id }}">
        <button type="submit">Перейти к оплате</button>
    </form>
    {% endif %}
</body>

<script>
    // Обработчик для обновления количества товара
    const forms = document.querySelectorAll('.quantity-form');

    forms.forEach(form => {
        form.addEventListener('submit', function(event) {
            event.preventDefault();  // Отменить стандартное поведение формы

            const formData = new FormData(form);
            const action = formData.get('change');
            const productId = form.closest('.cart-item').querySelector('input[name="product_id"]').value;
            const quantitySpan = document.getElementById('quantity_' + productId);

            // Отправка формы через AJAX для обновления количества товара
            fetch(form.action, {
                method: 'POST',
                body: formData
            }).then(response => {
                return response.json();
            }).then(data => {
                if (data.success) {
                    // Обновляем количество товара на странице
                    if (action === 'increase') {
                        quantitySpan.textContent = parseInt(quantitySpan.textContent) + 1;
                    } else if (action === 'decrease') {
                        quantitySpan.textContent = parseInt(quantitySpan.textContent) - 1;
                    }
                }
            }).catch(error => {
                console.log('Ошибка при обновлении количества товара:', error);
            });
        });
    });
</script>

</html>
