
<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="../static/static/css1.css">
    <title>Продукты для кошек</title>
</head>
<body>
    <header>
        <a id="backButton" href="/">Назад</a>
        <form action="/products" method="get">
            <input type="text" name="query" placeholder="Поиск по продуктам...">
            <button type="submit">Поиск</button>
        </form>
    </header>
   
    <div class="product-container">
<a href="../static/static/"></a>
        {% for product in postgres_data %}
            <div class="product">
                <a href="/product/{{ product.product_id }}">
                    <div class="product-title">{{ product.name }}</div>
                    <div class="product-image">
                        <img src="{{ product.map_p }}" alt="{{ product.name }}">
                    </div>
                    <div class="product-description">{{ product.description }}</div>
                    <div class="product-price">{{ product.price }} тг.</div>
                    <div class="product-stock">В наличии: {{ product.stock_quantity }} шт.</div>
                </a>
                
            </div>
        {% endfor %}
    </div>
</body>
</html>
<a href="..//static/static/cart.png"></a>
